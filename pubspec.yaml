
name: student_profile_app
description: "A professional Flutter student profile application built for Devixo Solutions internship - Task 01."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.3
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Custom fonts (optional - google_fonts package is used by default,
  # but you can also bundle your own fonts here)
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#6C63FF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#6C63FF"
  image: "assets/images/app_icon_foreground.png"
  android_12:
    color: "#6C63FF"
    image: "assets/images/app_icon_foreground.png"